name: ci
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -r requirements-lock.txt && pip install -e . --no-deps
      - run: ruff check . && ruff format --check .
      - run: python -m pytest -q
      - name: The evaluation reproduces the committed report
        run: |
          python scripts/evaluate.py
          git diff --exit-code reports/dev.json
      - name: Quality gate
        run: python scripts/gate.py
      - name: Example data, fixture and kit match their sources
        run: |
          python scripts/export.py
          git diff --exit-code data kits server/test/fixtures
      - name: README and console data match the reports
        run: |
          python scripts/readme.py
          git diff --exit-code README.md web/public/data/console.json
  server:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: server/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: The built server answers over stdio
        run: node scripts/smoke.mjs
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t mcp-resource-packs .
      - name: The image starts and refuses to run without a pack
        run: |
          set +e
          docker run --rm mcp-resource-packs; code=$?
          test "$code" = "2"
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run build
      - run: npm test
